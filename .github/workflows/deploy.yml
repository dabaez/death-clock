name: Deploy to DigitalOcean

on:
  push:
    branches:
      - main
  # Pull requests (Dependabot's included) run the checks but never deploy.
  pull_request:
  # Lets a deploy be re-run by hand, e.g. after a Dependabot merge.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The API tests. A commit that fails them never reaches the droplet.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

  # Uploads the source and the droplet builds it (deploy/build), since
  # better-sqlite3 is native and the server runs there. The deploy key can do
  # nothing but publish this site (see scripts/ship.sh).
  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Deploys run one at a time; a newer push waits instead of cancelling one
    # that is halfway through. Set on this job, not the workflow, so a pull
    # request's checks can't displace a deploy waiting its turn.
    concurrency:
      group: deploy
      cancel-in-progress: false
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # DEPLOY_TARGET is deathclock@<droplet>. DEPLOY_KNOWN_HOSTS is the
      # droplet's host key line, so the upload can't go to an impostor.
      - name: Upload to the droplet
        env:
          DEPLOY_TARGET: ${{ secrets.DEPLOY_TARGET }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          (umask 077 && printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519)
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          scripts/ship.sh
