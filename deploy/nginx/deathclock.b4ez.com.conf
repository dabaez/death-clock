# /etc/nginx/sites-available/deathclock.b4ez.com
#
# The Death Clock is a server process (NEW-SITE.md kind 4): nginx terminates
# TLS and proxies everything to the Node server on 127.0.0.1:8720, which
# serves both the API and the pages. Visitors' real addresses come from the
# Cloudflare real-IP snippet that nginx.conf already includes for every site.
#
# Install:
#   cp deploy/nginx/deathclock.b4ez.com.conf /etc/nginx/sites-available/deathclock.b4ez.com
#   ln -s ../sites-available/deathclock.b4ez.com /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# The certificate comes first, while only the port-80 server is enabled
# (comment out the 443 one until the files exist):
#   install -d -m 755 /var/www/acme
#   certbot certonly --webroot -w /var/www/acme -d deathclock.b4ez.com
#
# The webroot is outside the releases on purpose: a root-owned .well-known/
# inside a release stops the deathclock user from pruning it, and that fails
# every deploy.

server {
    listen 80;
    listen [::]:80;
    server_name deathclock.b4ez.com;

    # certbot --webroot, for the first certificate and its renewals.
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name deathclock.b4ez.com;

    ssl_certificate     /etc/letsencrypt/live/deathclock.b4ez.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/deathclock.b4ez.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    limit_req zone=ddos_limit burst=50 nodelay;
    limit_req_status 429;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1024;

    add_header X-Frame-Options "DENY"        always;
    add_header Referrer-Policy "same-origin" always;

    # The app itself refuses JSON bodies over 1 KB.
    client_max_body_size 16k;

    location / {
        proxy_pass http://127.0.0.1:8720;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
